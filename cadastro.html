<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Lara Games — Cadastro</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand brand" href="index.html">LARA <span class="brand-gradient">GAMES</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Loja</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="meus-jogos.html">Meus Jogos</a></li>
          <li class="nav-item"><a class="nav-link" href="suporte.html">Suporte</a></li>
          <li class="nav-item"><a class="nav-link active" href="cadastro.html">Criar Conta</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="container py-4">
    <h1 class="h3 fw-bold mb-1">Criar conta</h1>
    <p class="muted mb-0">Validação em JavaScript (mín. 6 caracteres na senha).</p>
  </header>

  <main id="conteudo-principal" class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="shell p-3 p-md-4">
          <div class="d-flex justify-content-end gap-2 mb-3">
            <button id="btnHighContrast" class="btn btn-outline-light btn-sm">
              <i class="bi bi-circle-half me-1"></i> Alto contraste
            </button>
            <button id="btnFontLarge" class="btn btn-outline-light btn-sm">
              <i class="bi bi-type me-1"></i> Fonte ampliada
            </button>
            <button id="btnClearPrefs" class="btn btn-outline-light btn-sm">
              <i class="bi bi-trash3 me-1"></i>
            </button>
          </div>

          <form id="cadastroForm">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome completo</label>
              <input type="text" id="nome" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-2">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" id="senha" class="form-control" required>
              <div class="form-text muted">Mínimo 6 caracteres.</div>
            </div>

            <button type="submit" class="btn btn-light w-100 mt-2">Cadastrar</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 mt-4">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="small muted">© <span data-ano></span> Lara Games — FIAP</span>
      <span class="small muted">Cadastro</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
