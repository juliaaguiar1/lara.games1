<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <title>Lara Games — Suporte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand brand" href="index.html">LARA <span class="brand-gradient">GAMES</span></a>
  </div>
</nav>

<header class="container py-4">
  <h1 class="h3 fw-bold">Suporte</h1>
  <p class="muted">Entre em contato conosco.</p>
</header>

<main class="container pb-5">
  <div class="shell p-3 p-md-4 col-lg-8 mx-auto">
    <form>
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mensagem</label>
        <textarea class="form-control" rows="4" required></textarea>
      </div>
      <button class="btn btn-light w-100">Enviar</button>
    </form>
  </div>
</main>

<footer class="py-3 mt-4">
  <div class="container d-flex justify-content-between">
    <span class="small muted">© <span data-ano></span> Lara Games</span>
    <span class="small muted">Suporte</span>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
