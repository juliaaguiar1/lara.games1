<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lara Games — Suporte</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-dark text-light">
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-neon">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <span class="logo">
          <span class="lara">LARA</span>
          <span class="games">GAMES</span>
          <svg class="curve" viewBox="0 0 200 20" aria-hidden="true"><path d="M5 12 C 45 2, 85 22, 125 12 S 205 18, 195 12" stroke="#00D1FF" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menuNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Loja</a></li>
          <li class="nav-item"><a class="nav-link" href="meus-jogos.html">Meus Jogos</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="suporte.html">Suporte</a></li>
          <li class="nav-item"><a class="nav-link" href="cadastro.html">Criar Conta</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="container text-center py-5">
    <h1 class="display-6 fw-bold">
      Suporte — <span class="lara">Lara</span> <span class="games">Games</span>
    </h1>
    <p class="lead">Envie sua mensagem e retornaremos em breve.</p>
    <div class="mt-3 acessibilidade" aria-label="Configurações de acessibilidade">
      <label class="me-3"><input type="checkbox" id="alto-contraste"> Alto contraste</label>
      <label><input type="checkbox" id="grande-fonte"> Fonte ampliada</label>
    </div>
  </header>

  <main id="conteudo-principal" tabindex="-1" class="container pb-5">
    <form class="row g-3 col-lg-8 col-md-10 mx-auto bg-panel p-4 rounded-3 border-neon">
      <div class="col-md-6">
        <label for="nome" class="form-label">Nome</label>
        <input id="nome" type="text" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" type="email" class="form-control" required>
      </div>
      <div class="col-12">
        <label for="mensagem" class="form-label">Mensagem</label>
        <textarea id="mensagem" rows="6" class="form-control" required></textarea>
      </div>
      <div class="col-12">
        <button class="btn btn-neon w-100" type="submit">Enviar</button>
      </div>
    </form>
  </main>

  <footer class="text-center py-4 border-top border-neon">
    <p class="mb-0">&copy; <span data-ano></span> Lara Games — Suporte</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
